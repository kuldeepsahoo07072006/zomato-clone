<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
    <h1>Zomato</h1>
    <p>Discover the best food & drinks</p>

    <input
        type="text"
        id="searchBox"
        placeholder="Search restaurants..."
        onkeyup="searchRestaurant()">
</header>

<section class="restaurants" id="restaurantList">

    <div class="card">
        <img src="images/restaurant1.jpg">
        <h3>Pizza Hub</h3>
        <p>Italian • Pizza • ₹300 for two</p>
    </div>

    <div class="card">
        <img src="images/restaurant2.jpg">
        <h3>Biryani House</h3>
        <p>Biryani • North Indian • ₹400 for two</p>
    </div>

    <div class="card">
        <img src="images/restaurant3.jpg">
        <h3>Burger Point</h3>
        <p>Burgers • Fast Food • ₹250 for two</p>
    </div>

</section>

<script src="script.js"></script>

</body>
</html>
